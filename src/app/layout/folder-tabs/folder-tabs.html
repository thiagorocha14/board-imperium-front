<nav class="tabs" aria-label="Navegação principal">
    @for (screen of screens; track screen.path) {
        <a
            class="tab"
            [routerLink]="linkFor(screen)"
            routerLinkActive="is-active"
            [routerLinkActiveOptions]="{ exact: true }"
            ariaCurrentWhenActive="page"
        >
            {{ screen.label }}
        </a>
    }
</nav>
