<div class="toolbar">
    <div class="levels">
        <span id="levels-label" class="levels-label">nosso nível</span>
        <div class="pill" role="group" aria-labelledby="levels-label">
            @for (level of levels(); track level) {
                <button
                    type="button"
                    class="pill-part"
                    [class.is-selected]="levelSelected(level)"
                    [attr.aria-pressed]="levelSelected(level)"
                    (click)="levelToggled.emit(level)"
                >
                    {{ level }}
                </button>
            }
        </div>
    </div>
</div>
