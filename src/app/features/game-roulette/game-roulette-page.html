<h1 class="sr-only">{{ title }}</h1>

<app-roulette-machine
    [columns]="columnViews()"
    [drawing]="drawing()"
    [leverDown]="leverDown()"
    [reducedMotion]="reducedMotion()"
    [canAdd]="reels().length < maxColumns"
    [canRemove]="reels().length > 1"
    (addColumn)="openNewColumn()"
    (pullLever)="pull()"
    (openCriterion)="openCriterion($event)"
    (redrawColumn)="redraw($event)"
    (removeColumn)="removeColumn($event)"
    (markBroken)="markBroken($event)"
/>

<app-criterion-dialog
    [header]="dialogHeader()"
    [open]="editingId() !== null"
    [draft]="draft()"
    [levels]="levels"
    [categories]="categories()"
    [mechanics]="mechanics()"
    [categoriesState]="categoriesState()"
    [mechanicsState]="mechanicsState()"
    [ready]="draftReady()"
    (visibleChange)="onCriterionVisible($event)"
    (modeChange)="setMode($event)"
    (levelChange)="setLevel($event)"
    (categoryChange)="setCategory($event)"
    (mechanicChange)="setMechanic($event)"
    (dismiss)="cancelCriterion()"
    (confirm)="confirmCriterion()"
/>
